<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion Editor</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/syntax.css">
</head>
<body class="theme-dark-purple">
    <header class="top-bar">
        <div class="menu-item">Archivo</div>
        <div class="menu-item">Editar</div>
        <div class="menu-item">Configuración</div>
        <div class="window-controls">
            <span class="control-btn minimize"></span>
            <span class="control-btn maximize"></span>
            <span class="control-btn close"></span>
        </div>
    </header>

    <main class="editor-container">
        <aside class="file-explorer" id="file-explorer">
            <div class="panel-header">EXPLORADOR</div>
            <div class="file-list">
                <!-- Archivos se cargarán aquí -->
            </div>
        </aside>

        <section class="main-workspace">
            <div id="window-system-container" class="window-system">
                <!-- Aquí vivirán las "mini-ventanas" -->
                <div class="mini-window" id="editor-window">
                    <div class="window-header">
                        <span class="window-title">main.js</span>
                        <div class="window-actions">
                            <button class="win-btn close-win">×</button>
                        </div>
                    </div>
                    <div class="window-content">
                        <div id="code-editor" contenteditable="true" spellcheck="false"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bottom-bar">
        <div class="terminal-toggle">Terminal</div>
        <div class="status-info">Orion v0.1</div>
    </footer>

    <script src="js/windows.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
